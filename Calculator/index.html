<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="overlay">
      <div class="main-container">
        <div class="equation-output" id="output"></div>

        <div class="buttons-grid">
          <button class="clear-button" id="clear">C</button>
          <button class="values-buttons-actions divide" value="/" id="divide">&divide;</button>
          <button class="values-buttons-actions multi" value="*" id="multiply">&times;</button>
          <button class="delete-button" value="rubber" id="rubber">
            <img src="backspace-7-512.png" class="rubber-icon">
          </button>
          <button class="values-buttons" value="1">1</button>
          <button class="values-buttons" value="2">2</button>
          <button class="values-buttons" value="3">3</button>
          <button class="values-buttons-actions" value="-" id="sub">&minus;</button>
          <button class="values-buttons" value="4">4</button>
          <button class="values-buttons" value="5">5</button>
          <button class="values-buttons" value="6">6</button>
          <button class="values-buttons-actions" value="+" id="sum">&plus;</button>
          <button class="values-buttons" value="7">7</button>
          <button class="values-buttons" value="8">8</button>
          <button class="values-buttons" value="9">9</button>
          <button class="equation-button result" id="equation">=</button>
          <button class="percent-action" id="percentage">&radic;</button>
          <button class="values-buttons dot" value=".">.</button>
          <button class="values-buttons" value="0">0</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
